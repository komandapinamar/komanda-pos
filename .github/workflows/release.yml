name: Release bundle

# Build firmado del AAB para Google Play.
# Disparo manual o al pushear un tag v*.
#
# Secrets requeridos en el repo:
#   KOMANDA_KEYSTORE_BASE64    -> base64 -w0 ~/.komanda/keys/komanda-pos-upload.jks
#   KOMANDA_KEYSTORE_PASSWORD
#   KOMANDA_KEY_ALIAS          -> komanda-pos
#   KOMANDA_KEY_PASSWORD

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}

      - name: Decode upload keystore
        run: |
          echo "${{ secrets.KOMANDA_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          chmod 600 "$RUNNER_TEMP/upload.jks"

      - name: Build signed bundle
        env:
          KOMANDA_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KOMANDA_KEYSTORE_PASSWORD: ${{ secrets.KOMANDA_KEYSTORE_PASSWORD }}
          KOMANDA_KEY_ALIAS: ${{ secrets.KOMANDA_KEY_ALIAS }}
          KOMANDA_KEY_PASSWORD: ${{ secrets.KOMANDA_KEY_PASSWORD }}
        run: ./gradlew :app:lintRelease :app:bundleRelease

      - name: Verify signature
        run: jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: komanda-pos-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
